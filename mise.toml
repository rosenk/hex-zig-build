# Tools for `zig build`. Rust is the newest stable (Hex's Cargo.lock needs
# 1.97 or later); every target builds through `zig build -Dtarget=…`.
[tools]
zig = "0.17.1"
rust = { version = "1.99.1", profile = "minimal", targets = "x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu" }
"aqua:rust-cross/cargo-zigbuild" = "0.24.1"
# Build-time generators: SPIRV-Tools' grammar tables (python) and OpenSSL's
# Configure (perl). Self-contained prebuilt interpreters, not the system's.
python = "3.15.2"
perl = "5.44.0.0"
