# Builds Hex for every target README.md names, checks what the README
# promises about each executable (scripts/check.sh), and keeps the
# executables as artifacts of the run.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu.2.27
            exe: hex
          - target: aarch64-linux-gnu.2.27
            exe: hex
          - target: x86_64-windows-gnu
            exe: hex.exe
    steps:
      - uses: actions/checkout@v7

      # Zig, Rust, cargo-zigbuild, Python and Perl, as mise.toml pins them.
      - uses: jdx/mise-action@v5

      # Zig's caches (fetched packages, compiled C and C++) and cargo's.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
            .zig-cache
            deps/*/.zig-cache
            zig-pkg
            deps/*/zig-pkg
            target
          key: build-${{ matrix.target }}-${{ hashFiles('mise.toml', '**/build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.target }}-${{ hashFiles('mise.toml', '**/build.zig.zon') }}-

      - run: zig build -Dtarget=${{ matrix.target }}

      - name: Check the executable
        run: |
          file zig-out/bin/${{ matrix.exe }}
          scripts/check.sh zig-out/bin/${{ matrix.exe }}

      # The oldest system the README names for glibc 2.27, with only the
      # libraries the executable is meant to need: the dynamic linker must
      # find every library and bind every symbol.
      - name: Load on Ubuntu 18.04
        if: matrix.target == 'x86_64-linux-gnu.2.27'
        run: |
          docker run --rm -v "$PWD/zig-out/bin:/hex:ro" ubuntu:18.04 sh -c '
            set -eu
            apt-get update -qq
            apt-get install -qq -y --no-install-recommends libasound2 libxkbcommon0 >/dev/null
            ldd -r /hex/hex 2>&1
          ' | tee ldd.txt
          if grep -E 'not found|undefined symbol|not a dynamic executable' ldd.txt; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: hex-${{ matrix.target }}
          path: zig-out/bin/${{ matrix.exe }}
          if-no-files-found: error
